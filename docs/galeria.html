<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galería - COOCAFE’S</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f7f7f7;
    }
    .gallery-img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s ease;
    }
    .gallery-img:hover {
      transform: scale(1.03);
    }
    header {
      background-color: #78550ead;
      color: white;
      padding: 30px 15px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>Galería de Imágenes</h1>
    <p>Documentos visuales de soporte ESAL 2025</p>
    <a href="index.html" class="btn btn-light mt-3">⬅ Volver al Inicio</a>
  </header>

  <main class="container py-5">
    <div class="row" id="galeria"></div>
  </main>

  <footer class="text-center bg-light py-3">
    © 2025 COOCAFE’S. Todos los derechos reservados.
  </footer>

  <!-- 🔁 Script para generar automáticamente las 26 imágenes -->
  <script>
    const galeria = document.getElementById('galeria');

    for (let i = 1; i <= 26; i++) {
      const numero = String(i).padStart(4, '0'); // 0001, 0002, etc.
      const nombreArchivo = `SOPORTE DE IMAGEN ESAL 2025_page-${numero}.jpg`;
      const ruta = `img/${nombreArchivo}`;

      const col = document.createElement('div');
      col.className = 'col-md-4 mb-4';

      const img = document.createElement('img');
      img.src = ruta;
      img.alt = `Imagen ${i}`;
      img.className = 'gallery-img';

      col.appendChild(img);
      galeria.appendChild(col);
    }
  </script>

</body>
</html>
